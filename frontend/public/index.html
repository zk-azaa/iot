<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Home Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
            <header>
                <h1>🏠 Smart Home</h1>
                <p>Dashboard Kontrol Lampu Rumah</p>
            </header>

            <!-- CHATBOX -->
            <section class="chatbox" aria-label="Asisten Smart Home">
                <div class="chat-header">
                    <h3>🤖 Asisten Rumah</h3>
                    <span>Mode demo</span>
                </div>

                <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

                <div class="chat-input">
                    <input
                        type="text"
                        id="chatInput"
                        placeholder="Contoh: nyalakan lampu kamar"
                        autocomplete="off"
                        aria-label="Pesan untuk asisten"
                    >
                    <button id="chatSend" onclick="sendChat()">KIRIM</button>
                </div>
            </section>

            <div class="summary">
                <div class="summary-card">
                    <h2 id="totalLamp">4</h2>
                    <p>Total Lampu</p>
                </div>

                <div class="summary-card">
                    <h2 id="activeLamp">0</h2>
                    <p>Lampu Menyala</p>
                </div>

                <div class="summary-card">
                    <h2 id="offLamp">4</h2>
                    <p>Lampu Mati</p>
                </div>
        </div>

        <h3 class="section-title">Kontrol Lampu</h3>

        <div class="lamp-grid">

            <div class="lamp-card" id="card0">
                <div class="lamp-icon">💡</div>
                <h3>Lampu Ruang Tamu</h3>
                <p class="status" id="status0">OFF</p>
                <button class="switch" onclick="toggleLamp(0)">NYALAKAN</button>
            </div>

            <div class="lamp-card" id="card1">
                <div class="lamp-icon">💡</div>
                <h3>Lampu Kamar</h3>
                <p class="status" id="status1">OFF</p>
                <button class="switch" onclick="toggleLamp(1)">NYALAKAN</button>
            </div>

            <div class="lamp-card" id="card2">
                <div class="lamp-icon">💡</div>
                <h3>Lampu Dapur</h3>
                <p class="status" id="status2">OFF</p>
                <button class="switch" onclick="toggleLamp(2)">NYALAKAN</button>
            </div>

            <div class="lamp-card" id="card3">
                <div class="lamp-icon">💡</div>
                <h3>Lampu Teras</h3>
                <p class="status" id="status3">OFF</p>
                <button class="switch" onclick="toggleLamp(3)">NYALAKAN</button>
            </div>

        </div>

        <div class="controls">
            <button class="btn-on" onclick="allLamp(true)">
                NYALAKAN SEMUA
            </button>

            <button class="btn-off" onclick="allLamp(false)">
                MATIKAN SEMUA
            </button>
        </div>

        <footer>
            Smart Home Dashboard | HTML CSS JavaScript
        </footer>
    </div>

    <script src="app.js"></script>

</body>
</html>
